[project]
name = "hotel-mangos-backend"
version = "0.1.0"
description = "API de gestion del Hotel Los Mangos (hospedaje, restaurante, bar, caja)"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "celery[redis]>=5.6.3",
    "fastapi>=0.139.2",
    "bcrypt>=4.3.0",
    "icalendar>=6.4.0",
    "psycopg[binary]>=3.3.4",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "requests>=2.32.3",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008", # FastAPI's `Depends(...)` in argument defaults is the idiomatic pattern.
]
